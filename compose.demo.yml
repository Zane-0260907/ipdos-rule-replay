services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: diet_demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: diet_demo
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - diet_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diet_demo -d diet_demo']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  diet_demo_data:
